# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wcl-parse-curve
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm serve
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Asked for when the Blueprint is created; never commit these.
      - key: WCL_CLIENT_ID
        sync: false
      - key: WCL_CLIENT_SECRET
        sync: false
