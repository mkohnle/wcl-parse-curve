# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: logscope
    runtime: node
    plan: free
    region: frankfurt
    # `corepack enable` fails on Render (/usr/bin is read-only); `corepack pnpm` runs the
    # pnpm version pinned in package.json without installing anything globally.
    buildCommand: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm build
    startCommand: node src/server/main.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Asked for when the Blueprint is created; never commit these.
      - key: WCL_CLIENT_ID
        sync: false
      - key: WCL_CLIENT_SECRET
        sync: false
      # optional: Upstash Redis, so the cache survives restarts and deploys
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
