<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logscope</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="min-h-screen font-sans text-zinc-200 antialiased">
    <header class="sticky top-0 z-30 border-b border-white/10 bg-black/70 backdrop-blur">
      <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-4">
        <a href="/" class="flex items-center gap-2 font-display text-xl font-bold uppercase tracking-wide text-gold">
          <img src="/favicon.svg" alt="" class="size-7" />Logscope
        </a>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 pb-24">
      <section class="py-10 text-center sm:py-14">
        <form id="load-form" class="relative mx-auto max-w-2xl">
          <input
            id="url"
            autocomplete="off"
            spellcheck="false"
            aria-label="Warcraft Logs report link, or character as Name-Realm"
            placeholder="Report link, or Name-Realm"
            class="h-12 w-full rounded-sm border border-line bg-black/50 pr-24 pl-4 text-zinc-100 outline-none transition placeholder:text-zinc-600 focus:border-gold/70"
          />
          <button
            id="region"
            type="button"
            title="Region for character search"
            class="absolute inset-y-2 right-12 w-10 rounded-sm border border-line text-xs font-semibold text-zinc-300 hover:border-zinc-500"
          >
            EU
          </button>
          <ul
            id="suggest"
            class="absolute inset-x-0 top-full z-20 mt-1 hidden overflow-hidden rounded-sm border border-line bg-panel text-left text-sm shadow-lg"
          ></ul>
          <button
            id="go"
            type="submit"
            aria-label="Search"
            class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-zinc-400 hover:text-gold disabled:cursor-wait disabled:opacity-50"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m15.5 15.5 5 5" />
            </svg>
          </button>
        </form>
        <div id="status" class="mt-4 min-h-6 text-sm text-zinc-400" role="status"></div>
      </section>

      <div id="report" class="space-y-6"></div>
    </main>

    <footer class="mx-auto max-w-6xl px-4 pb-8 text-center text-xs text-zinc-600">
      <span id="budget"></span>
    </footer>

    <div
      id="tooltip"
      class="pointer-events-none fixed z-50 hidden rounded border border-line bg-black/90 px-3 py-2 text-sm shadow-xl backdrop-blur"
    ></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
